version: '3.8'

services:
  frontend:
    build: .
    ports:
      - '0.0.0.0:5173:5173'
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - VITE_CONVEX_URL=http://127.0.0.1:${PORT:-3210}
    networks:
      - ai-town-network
  backend:
    image: ghcr.io/get-convex/convex-backend:latest
    ports:
      - '${PORT:-3210}:3210'
      - '${SITE_PROXY_PORT:-3211}:3211'
      - '${OLLAMA_PORT:-11434}:11434'
    volumes:
      - data:/convex/data
    environment:
      - INSTANCE_NAME=${INSTANCE_NAME:-}
      - INSTANCE_SECRET=${INSTANCE_SECRET:-}
      - CONVEX_RELEASE_VERSION_DEV=${CONVEX_RELEASE_VERSION_DEV:-}
      - ACTIONS_USER_TIMEOUT_SECS=${ACTIONS_USER_TIMEOUT_SECS:-}
      - CONVEX_CLOUD_ORIGIN=${URL_BASE:-http://127.0.0.1}:${PORT:-3210}
      - CONVEX_SITE_ORIGIN=${URL_BASE:-http://127.0.0.1}:${SITE_PROXY_PORT:-3211}
      - DATABASE_URL=${DATABASE_URL:-}
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 5s
    networks:
      - ai-town-network

  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    ports:
      - '${DASHBOARD_PORT:-6791}:6791'
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=http://127.0.0.1:${PORT:-3210}
    depends_on:
      backend:
        condition: service_healthy

  # Neo4j database for Graphiti knowledge graph
  neo4j:
    image: neo4j:5.15-community
    ports:
      - '${NEO4J_BOLT_PORT:-7687}:7687'
      - '${NEO4J_HTTP_PORT:-7474}:7474'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-graphiti123}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-graphiti123}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-town-network

  # Graphiti knowledge graph MCP server (official)
  graphiti:
    image: zepai/knowledge-graph-mcp:standalone
    ports:
      - '${GRAPHITI_PORT:-8000}:8000'
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-graphiti123}
      - NEO4J_DATABASE=neo4j
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - MODEL_NAME=gpt-4o-mini
      - GRAPHITI_GROUP_ID=ai-town
      - SEMAPHORE_LIMIT=10
      - CONFIG_PATH=/app/mcp/config/config.yaml
      - PATH=/root/.local/bin:${PATH}
    volumes:
      - ../graphiti/mcp_server/config/config-docker-neo4j.yaml:/app/mcp/config/config.yaml:ro
    depends_on:
      - neo4j
    restart: on-failure
    command: ["uv", "run", "main.py"]
    networks:
      - ai-town-network

volumes:
  data:
  neo4j_data:
  neo4j_logs:
  graphiti_data:

networks:
  ai-town-network:
    driver: bridge
